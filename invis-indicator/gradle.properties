# Проверь актуальность этих версий на https://fabricmc.net/develop и
# https://modrinth.com/mod/fabric-api перед сборкой — новые патчи выходят часто.
minecraft_version=26.1.2
loader_version=0.18.4
fabric_version=0.155.2+26.1.2
loom_version=1.15.+

# Java: начиная с 26.1 Minecraft требует свежий JDK. Если сборка ругается на
# --release, поставь версию из документации Fabric для 26.1.2 (на момент
# написания это Java 21+, но сверься с docs.fabricmc.net).
java_version=21

mod_version=1.0.0
maven_group=ru.holyworld
archives_base_name=invis-indicator

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
